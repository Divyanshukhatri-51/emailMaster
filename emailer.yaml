services:
  postgres:
    image: postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: qwerty
      POSTGRES_DB: divyanshuMail
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: qwerty
    depends_on:
      - postgres

  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    environment:
      - DATABASE_URL=postgresql://admin:qwerty@postgres:5432/divyanshuMail?schema=public
      - PORT=5001
      - ALLOWED_ORIGINS=http://localhost:3001,http://localhost:3002,http://localhost:5173
      - JWT_SECRET=fallback_secret_key_123
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      - postgres

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3002:80"
    depends_on:
      - api

volumes:
  postgres_data:
